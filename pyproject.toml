[project]
name = "ask"
version = "0.1.0"
description = "Turn natural language into shell commands."
requires-python = ">=3.12"
dependencies = [
    "openai",
]

[project.scripts]
ask = "ask.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ask"
module-root = "src"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pandas>=3.0.5",
]
