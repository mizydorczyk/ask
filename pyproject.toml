[project]
name = "ask"
version = "0.1.0"
description = "The Zsh shell and tmux assistant."
requires-python = ">=3.12"
dependencies = [
    "openai==2.53.0",
]

[project.scripts]
ask = "ask.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ask"
module-root = "src"

[dependency-groups]
dev = [
    "accelerate==1.14.0",
    "datasets==5.0.1",
    "huggingface-hub==1.27.0",
    "jupyter==1.1.1",
    "peft==0.20.0",
    "transformers==5.14.1",
    "trl==1.9.2",
]
